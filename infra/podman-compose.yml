version: "3.8"

# Local infrastructure for hash-compare integration tests.
#
# Bring up:   podman-compose -f infra/podman-compose.yml up -d
# Tear down:  podman-compose -f infra/podman-compose.yml down -v
#
# Services:
#   mongo       — MongoDB 7 replica-set (change streams + pre-image required for Option 1)
#   mongo-init  — one-shot: initiates the replica set
#   zookeeper   — Kafka coordination
#   kafka       — Kafka 3 broker (single node for local tests)
#   localstack  — AWS-compatible SQS (for Option 2 SQS publisher)

services:

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: m1_mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    container_name: m1_mongo_init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongo --eval
      "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]});
       rs.status();"
    restart: "no"

  # Enable pre-image collection on the members collection for Option 1 CDC.
  # Runs after replica-set is initialised.
  mongo-preimage:
    image: mongo:7
    container_name: m1_mongo_preimage
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    entrypoint: >
      mongosh --host mongo --eval
      "db = db.getSiblingDB('m1');
       db.createCollection('members');
       db.runCommand({
         collMod: 'members',
         changeStreamPreAndPostImages: { enabled: true }
       });
       print('pre-image enabled');"
    restart: "no"

  # ── Zookeeper ───────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: m1_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ── Kafka ───────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: m1_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── LocalStack (SQS) ────────────────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    container_name: m1_localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      DEBUG: "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Create the test SQS queue once LocalStack is up
  localstack-init:
    image: amazon/aws-cli:2.15.0
    container_name: m1_localstack_init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      aws --endpoint-url=http://localstack:4566 sqs create-queue
        --queue-name m1-member-diff
    restart: "no"
