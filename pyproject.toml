[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m1-hash-compare"
version = "0.1.0"
description = "M1 canonical member hash-compare feature — two pipeline options"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6.0",
    "kafka-python>=2.0.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
