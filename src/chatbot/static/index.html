<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fallout Agent — Skill Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1a3a5c; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.8rem; opacity: 0.7; }
    #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
    .bubble.user { background: #1a3a5c; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bubble.assistant { background: #fff; color: #222; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .bubble.system { background: #e8f4fd; color: #555; align-self: center; font-size: 0.8rem; border-radius: 8px; }
    #input-row { display: flex; gap: 10px; padding: 16px 24px; background: #fff; border-top: 1px solid #e0e0e0; }
    #message-input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; resize: none; height: 44px; }
    #send-btn { background: #1a3a5c; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { align-self: flex-start; color: #888; font-size: 0.85rem; font-style: italic; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.85em; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.85em; }
    a { color: #1a6fc4; }
    nav { display: flex; gap: 12px; padding: 8px 24px; background: #eef1f5; border-bottom: 1px solid #ddd; }
    nav a { font-size: 0.85rem; color: #1a3a5c; text-decoration: none; font-weight: 500; }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Fallout Agent — Skill Manager</h1>
      <span>AI-powered medical insurance fallout resolution</span>
    </div>
  </header>
  <nav>
    <a href="/">Chat</a>
    <a href="/evals" target="_blank">Evals Dashboard</a>
    <a href="/health" target="_blank">Health</a>
    <a href="/docs" target="_blank">API Docs</a>
  </nav>
  <div id="chat-container">
    <div class="bubble system">Welcome! I can help you create, view, edit, or deactivate fallout skill files. What would you like to do?</div>
  </div>
  <div id="input-row">
    <textarea id="message-input" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const sessionId = 'session-' + Math.random().toString(36).slice(2);
    const container = document.getElementById('chat-container');
    const input = document.getElementById('message-input');
    const btn = document.getElementById('send-btn');

    function renderMarkdown(text) {
      return text
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.innerHTML = renderMarkdown(text);
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      btn.disabled = true;
      addBubble('user', text);
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.textContent = 'Thinking…';
      container.appendChild(typing);
      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        const data = await res.json();
        typing.remove();
        addBubble('assistant', data.message);
      } catch (err) {
        typing.remove();
        addBubble('system', 'Error: ' + err.message);
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }

    btn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
